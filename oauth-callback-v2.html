<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nexora — Connexion Google</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a12;color:#fff;font:500 14px system-ui}.box{padding:32px;border:1px solid #26304a;border-radius:20px;background:#0e1420;text-align:center;width:min(440px,88vw)}.orb{width:64px;height:64px;border-radius:50%;margin:0 auto 20px;border:1px solid #7b68ff;box-shadow:0 0 50px #7b68ff55;animation:p 1.8s infinite}.orb:after{content:'N';display:grid;place-items:center;width:34px;height:34px;margin:14px;border-radius:11px;background:#765cff;font-weight:800}@keyframes p{50%{transform:scale(1.08)}}</style></head><body><main class="box"><div class="orb"></div><h1 id="title">Connexion à Nexora…</h1><p id="text">Vérification de votre session Google.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=20260904-2"></script><script>(async()=>{const title=document.getElementById('title'),text=document.getElementById('text'),wait=ms=>new Promise(r=>setTimeout(r,ms));const params=new URLSearchParams(location.search),hash=new URLSearchParams((location.hash||'').replace(/^#/,'').replace(/^\?/,'').trim());const flow=params.get('flow')||hash.get('flow')||sessionStorage.getItem('nexoraOAuthFlow')||localStorage.getItem('nexoraOAuthFlow')||'login';try{const client=await window.NexoraSupabase.getClient();const code=params.get('code');if(code){title.textContent='Validation Google…';const out=await client.auth.exchangeCodeForSession(code);if(out.error)throw out.error;}else{const at=hash.get('access_token'),rt=hash.get('refresh_token');if(at&&rt){const out=await client.auth.setSession({access_token:at,refresh_token:rt});if(out.error)throw out.error;}}let session=null;for(let i=0;i<10&&!session;i++){const out=await client.auth.getSession();if(out.error)throw out.error;session=out.data.session;if(!session)await wait(400);}if(!session)throw new Error('Session Google non disponible.');title.textContent='Synchronisation de votre profil…';const response=await fetch('/api/oauth-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:session.access_token})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok||!result.profile)throw new Error(result.error||'Profil Nexora indisponible.');const provider=session.user?.app_metadata?.provider||'google',account={...result.profile,signedIn:true,provider};localStorage.setItem('nexoraAccount',JSON.stringify(account));localStorage.setItem('nexoraSession','active');localStorage.setItem('nexoraOAuthProvider',provider);sessionStorage.removeItem('nexoraOAuthFlow');localStorage.removeItem('nexoraOAuthFlow');if(flow==='signup'){title.textContent='Bienvenue sur Nexora.';text.textContent='Votre compte Google est prêt. Ouverture de votre quiz…';setTimeout(()=>location.replace(account.profileComplete?'platform.html':'onboarding.html?oauth=1'),700)}else if(flow==='postquiz-signup'){title.textContent='Compte Google connecté.';text.textContent='Retour vers votre quiz…';setTimeout(()=>location.replace('onboarding.html?oauth=postquiz-complete'),700)}else{title.textContent=`Bonjour ${account.firstName||account.name||'Utilisateur'} 👋`;text.textContent='Votre espace Nexora est prêt.';setTimeout(()=>location.replace('platform.html'),700)}}catch(error){console.error('[Nexora] OAuth callback failed:',error);title.textContent='Connexion Google impossible';text.textContent=String(error?.message||'La session Google est invalide.');setTimeout(()=>location.replace('login.html?oauth_error=1'),3500)}})();</script></body></html>
