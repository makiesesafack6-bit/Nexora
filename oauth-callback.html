<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nexora — Connexion</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a12;color:#fff;font:500 14px system-ui}.box{padding:32px;border:1px solid #26304a;border-radius:20px;background:#0e1420;text-align:center;width:min(440px,88vw)}.orb{width:64px;height:64px;border-radius:50%;margin:0 auto 20px;border:1px solid #7b68ff;box-shadow:0 0 50px #7b68ff55;animation:p 1.8s infinite}.orb:after{content:'N';display:grid;place-items:center;width:34px;height:34px;margin:14px;border-radius:11px;background:#765cff;font-weight:800}@keyframes p{50%{transform:scale(1.08)}}</style></head><body><main class="box"><div class="orb"></div><h1 id="title">Connexion à Nexora…</h1><p id="text">Vérification de votre session sécurisée.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=20260902-4"></script><script>(async()=>{try{const client=await window.NexoraSupabase.getClient();const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session)throw new Error('Session OAuth absente.');const user=data.session.user;const metadata=user.user_metadata||{};const name=(metadata.full_name||metadata.name||'').trim();const parts=name.split(/\s+/).filter(Boolean);const firstName=metadata.first_name||parts.shift()||'';const lastName=metadata.last_name||parts.join(' ');const baseUsername=(metadata.user_name||metadata.preferred_username||user.email?.split('@')[0]||`google_${user.id.slice(0,8)}`).replace(/[^a-zA-Z0-9_.-]/g,'_').slice(0,24);const username=`${baseUsername}_${user.id.slice(0,6)}`.slice(0,30);const account={firstName,lastName,name:`${firstName} ${lastName}`.trim(),username,role:'',company:'',phone:'',email:user.email||'',birthDate:'',otpChannel:'sms',profileComplete:false,signedIn:true,verifiedPhone:false,provider:user.app_metadata?.provider||'google'};localStorage.setItem('nexoraAccount',JSON.stringify(account));localStorage.setItem('nexoraSession','active');const {error:profileError}=await client.from('profiles').upsert({id:user.id,phone:null,email:user.email||null,first_name:firstName||'Utilisateur',last_name:lastName||'Nexora',username,role:null,company:null,birth_date:null,otp_channel:'sms',verified_phone:false,profile_complete:false},{onConflict:'id'});if(profileError)throw profileError;document.getElementById('text').textContent='Compte Google connecté. Ouverture de Nexora…';setTimeout(()=>{window.location.href='platform.html'},900);}catch(error){console.error('[Nexora] OAuth callback failed:',error);document.getElementById('title').textContent='Connexion impossible';document.getElementById('text').textContent='Le fournisseur OAuth n’est pas encore configuré ou la session est invalide. Retournez à la connexion.';setTimeout(()=>location.href='login.html',2500);}})();</script></body></html>
