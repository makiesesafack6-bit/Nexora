<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nexora — Connexion</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a12;color:#fff;font:500 14px system-ui}.box{padding:32px;border:1px solid #26304a;border-radius:20px;background:#0e1420;text-align:center;width:min(440px,88vw)}.orb{width:64px;height:64px;border-radius:50%;margin:0 auto 20px;border:1px solid #7b68ff;box-shadow:0 0 50px #7b68ff55;animation:p 1.8s infinite}.orb:after{content:'N';display:grid;place-items:center;width:34px;height:34px;margin:14px;border-radius:11px;background:#765cff;font-weight:800}@keyframes p{50%{transform:scale(1.08)}}</style></head><body><main class="box"><div class="orb"></div><h1 id="title">Connexion à Nexora…</h1><p id="text">Vérification de votre session sécurisée.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=20260904-1"></script><script>(async()=>{const title=document.getElementById('title'),text=document.getElementById('text');const wait=ms=>new Promise(r=>setTimeout(r,ms));try{const client=await window.NexoraSupabase.getClient();const params=new URLSearchParams(window.location.search);const hash=(window.location.hash||'').replace(/^#/,'');const flow=params.get('flow')||localStorage.getItem('nexoraOAuthFlow')||(hash==='signup'?'signup':hash==='login'?'login':'login');const code=params.get('code');if(code){title.textContent='Validation Google…';const {error}=await client.auth.exchangeCodeForSession(code);if(error)throw error;}let session=null;for(let i=0;i<5&&!session;i++){const {data,error}=await client.auth.getSession();if(error)throw error;session=data.session;if(!session)await wait(500);}if(!session)throw new Error('Session Google non disponible.');const user=session.user;title.textContent='Synchronisation de votre profil…';const response=await fetch('/api/oauth-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:session.access_token})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok||!result.profile)throw new Error(result.error||'Profil Nexora indisponible.');const account={...result.profile,signedIn:true,provider:user.app_metadata?.provider||'google'};localStorage.setItem('nexoraAccount',JSON.stringify(account));localStorage.setItem('nexoraSession','active');localStorage.setItem('nexoraOAuthProvider',account.provider);localStorage.removeItem('nexoraOAuthFlow');if(flow==='postquiz-signup'){title.textContent='Compte Google connecté.';text.textContent='Retour vers votre quiz pour finaliser le profil…';setTimeout(()=>location.href='onboarding.html?oauth=postquiz-complete',600)}else if(flow==='signup'){title.textContent='Bienvenue sur Nexora.';text.textContent=account.profileComplete?'Votre profil est déjà complet. Ouverture de votre espace…':'Votre compte est créé. Préparation de votre quiz…';setTimeout(()=>location.href=account.profileComplete?'platform.html':'onboarding.html?oauth=1',900)}else if(account.profileComplete){title.textContent=`Bonjour ${account.firstName||account.name||'Utilisateur'} 👋`;text.textContent='Votre espace Nexora est prêt. Ouverture du dashboard…';setTimeout(()=>location.href='platform.html',900)}else{title.textContent='Bienvenue sur Nexora.';text.textContent='Votre profil n’est pas encore terminé. Reprise de votre quiz…';setTimeout(()=>location.href='onboarding.html?oauth=1',900)}}catch(error){console.error('[Nexora] OAuth callback failed:',error);title.textContent='Connexion impossible';text.textContent=String(error?.message||'Le fournisseur OAuth ou la session est invalide.');setTimeout(()=>location.href='login.html',2200)}})();</script></body></html>
