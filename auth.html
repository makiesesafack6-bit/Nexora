<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="onboarding.css" />
  <style>
    .auth-card{max-width:560px;margin:0 auto;background:rgba(255,255,255,.92);border:1px solid #e0e2e4;border-radius:28px;padding:42px;box-shadow:0 28px 80px rgba(16,18,22,.08)}
    .auth-card h1{font:800 44px/1 'Manrope',sans-serif;letter-spacing:-.06em;margin:14px 0 12px}.auth-card p{color:#70777f;font-size:13px;line-height:1.7}.social-grid{display:grid;gap:10px;margin:24px 0}.auth-form{display:grid;gap:13px}.auth-form label{font-size:11px;font-weight:700;color:#60676e}.auth-form input{display:block;width:100%;margin-top:7px;border:1px solid #dfe2e4;border-radius:13px;padding:14px 15px;font:500 13px 'DM Sans';outline:none}.auth-form input:focus{border-color:#8d949b}.divider{text-align:center;color:#a0a6ac;font-size:10px;margin:20px 0;display:flex;align-items:center;gap:10px}.divider:before,.divider:after{content:"";height:1px;background:#e6e8ea;flex:1}.social-button{min-height:48px;border:1px solid #dfe2e4;background:#fff;border-radius:13px;font:700 12px 'DM Sans';cursor:pointer}.auth-footer{text-align:center;margin-top:20px;color:#8d9399;font-size:11px}.auth-footer a{color:#111318;font-weight:800;text-decoration:none}.auth-message{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;background:#f0f1f1;color:#454b51;font-size:11px}.auth-message.show{display:block}
  </style>
</head>
<body>
  <header class="onboarding-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>Nexora</span></a><span class="header-note">Compte Nexora</span></header>
  <main class="onboarding-shell">
    <section class="auth-card">
      <span class="eyebrow">BON RETOUR</span>
      <h1>Connectez-vous.</h1>
      <p>Retrouvez votre profil, vos opportunités et votre espace Nexora.</p>
      <div class="social-grid"><button class="social-button" id="googleLogin">Continuer avec Google</button><button class="social-button" id="appleLogin">Continuer avec Apple</button></div>
      <div class="divider"><span>ou avec votre email</span></div>
      <form class="auth-form" id="loginForm"><label>Email<input id="loginEmail" type="email" required placeholder="vous@exemple.com" /></label><label>Mot de passe<input id="loginPassword" type="password" required placeholder="Votre mot de passe" /></label><button class="primary-button" type="submit">Se connecter →</button></form>
      <div class="auth-message" id="authMessage"></div>
      <div class="auth-footer">Pas encore de compte ? <a href="onboarding.html">Créer mon profil</a></div>
    </section>
  </main>
  <script>
    const message=document.getElementById('authMessage');
    const redirect=()=>{window.location.href='platform.html';};
    document.getElementById('googleLogin').addEventListener('click',()=>{localStorage.setItem('nexoraSessionProvider','google');redirect();});
    document.getElementById('appleLogin').addEventListener('click',()=>{localStorage.setItem('nexoraSessionProvider','apple');redirect();});
    document.getElementById('loginForm').addEventListener('submit',(e)=>{e.preventDefault();const account=JSON.parse(localStorage.getItem('nexoraAccount')||'null');const email=document.getElementById('loginEmail').value.trim();if(!account){message.textContent='Aucun compte Nexora de démonstration n’existe encore. Créez votre profil pour commencer.';message.classList.add('show');return;}if(account.email!==email && account.provider==='email'){message.textContent='Cet email ne correspond pas au compte de démonstration enregistré sur cet appareil.';message.classList.add('show');return;}localStorage.setItem('nexoraSession','active');redirect();});
  </script>
</body>
</html>
